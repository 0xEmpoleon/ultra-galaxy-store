<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD.ai — 1:1 RECONSTRUCTION</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-inner">
            <div class="nav-left">
                <a href="#" class="nav-logo-fallback">USDai</a>
                <nav class="nav-links">
                    <a href="#" class="nav-link active">Buy</a>
                    <a href="#" class="nav-link">Stake</a>
                    <a href="#" class="nav-link">Bridge</a>
                </nav>
            </div>
            <div class="nav-right">
                <button class="nav-connect-btn">Connect Wallet</button>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <!-- Home / Dashboard -->
        <div class="sidebar-icon active" title="Dashboard">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
        </div>
        <!-- Swap -->
        <div class="sidebar-icon" title="Swap">
            <svg viewBox="0 0 24 24">
                <polyline points="17 1 21 5 17 9"></polyline>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <polyline points="7 23 3 19 7 15"></polyline>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
        </div>
        <!-- Earn / Yield -->
        <div class="sidebar-icon" title="Earn">
            <svg viewBox="0 0 24 24">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        </div>
        <!-- Analytics -->
        <div class="sidebar-icon" title="Analytics">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        </div>

        <div class="sidebar-spacer"></div>

        <!-- Settings -->
        <div class="sidebar-icon" title="Settings">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Metrics Bar -->
        <div class="metrics-bar">
            <div class="metric-item">
                <span class="metric-label">TVL</span>
                <span class="metric-value">$48.2M</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">APY</span>
                <span class="metric-value metric-value--accent">6.85%</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Exp. APY</span>
                <span class="metric-value metric-value--accent">12.19%</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Fair Value</span>
                <div class="metric-icons">
                    <img src="https://app.usd.ai/svg/erc20/usdai.svg" alt="USDai" class="metric-token-icon"
                        onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active">Buy</button>
            <button class="tab-btn">Stake</button>
            <button class="tab-btn">Bridge</button>
        </div>

        <!-- Swap Card -->
        <div class="swap-card">
            <!-- You Pay -->
            <div class="swap-section">
                <div class="swap-section-label">You pay</div>
                <div class="swap-input-row">
                    <div class="token-selector">
                        <div class="token-icon-wrap">
                            <img src="https://app.usd.ai/svg/erc20/usdc.svg" alt="USDC" class="token-icon"
                                onerror="this.style.background='#2775CA';this.style.borderRadius='50%'">
                            <img src="https://app.usd.ai/svg/chain-logos/arbitrum.svg" alt="Arbitrum"
                                class="chain-badge"
                                onerror="this.style.background='#28A0F0';this.style.borderRadius='50%'">
                        </div>
                        <div>
                            <div class="token-name">USDC</div>
                            <div class="token-chain">Arbitrum</div>
                        </div>
                        <span class="token-chevron">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                    <input type="text" class="swap-amount-input" placeholder="0.00" readonly>
                </div>
                <div class="balance-row">
                    <span class="balance-text">Balance: &mdash;</span>
                </div>
            </div>

            <!-- Swap Arrow -->
            <div class="swap-arrow-container">
                <button class="swap-arrow-btn">
                    <svg viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </button>
            </div>

            <!-- You Receive -->
            <div class="swap-section">
                <div class="swap-section-label">You receive</div>
                <div class="swap-input-row">
                    <div class="token-selector">
                        <div class="token-icon-wrap">
                            <img src="https://app.usd.ai/svg/erc20/usdai.svg" alt="USDai" class="token-icon"
                                onerror="this.style.background='#0D0D0D';this.style.borderRadius='50%'">
                            <img src="https://app.usd.ai/svg/chain-logos/arbitrum.svg" alt="Arbitrum"
                                class="chain-badge"
                                onerror="this.style.background='#28A0F0';this.style.borderRadius='50%'">
                        </div>
                        <div>
                            <div class="token-name">USDai</div>
                            <div class="token-chain">Arbitrum</div>
                        </div>
                        <span class="token-chevron">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                    <input type="text" class="swap-amount-input" placeholder="0.00" readonly>
                </div>
                <div class="balance-row">
                    <span class="balance-text">Balance: &mdash;</span>
                </div>
            </div>

            <!-- Details -->
            <div class="swap-details">
                <div class="detail-row">
                    <span class="detail-label">Exchange Rate</span>
                    <span class="detail-value">1 USDC &rarr; 1 USDai</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Max Slippage</span>
                    <span class="detail-value">0.1%</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Network Fee</span>
                    <span class="detail-value">&lt;$0.01</span>
                </div>
            </div>

            <!-- CTA -->
            <button class="swap-cta">Connect Wallet</button>
        </div>

        <!-- Allo Badge -->
        <div class="allo-badge">
            <div class="allo-dot"></div>
            <span class="allo-text">Eligible for <span>Allo&trade;</span> rewards &mdash; GPU-backed credit earnings</span>
        </div>
    </main>
</body>

</html>
